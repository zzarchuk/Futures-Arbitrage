<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Арбитражный Бот - Сигналы</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e6ed;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(102, 252, 241, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(69, 162, 158, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      padding: 24px 32px;
      background: rgba(15, 20, 40, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(102, 252, 241, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #66fcf1 0%, #45a29e 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(102, 252, 241, 0.3);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #66fcf1 0%, #45a29e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(102, 252, 241, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(102, 252, 241, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #66fcf1;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }

    #messages {
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .msg {
      padding: 24px;
      border-radius: 16px;
      background: rgba(31, 40, 51, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(102, 252, 241, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .msg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #66fcf1 0%, #45a29e 100%);
      transition: width 0.3s ease;
    }

    .msg:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 16px 48px rgba(102, 252, 241, 0.2);
      border-color: rgba(102, 252, 241, 0.3);
    }

    .msg:hover::before {
      width: 6px;
    }

    .msg.updated {
      animation: updatePulse 0.6s ease;
      border-color: rgba(255, 179, 71, 0.5);
    }

    .msg.updated::before {
      background: linear-gradient(180deg, #ffb347 0%, #ff8c42 100%);
    }

    @keyframes updatePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .msg.deleting {
      animation: deleteSlide 0.4s ease forwards;
    }

    @keyframes deleteSlide {
      to {
        opacity: 0;
        transform: translateX(-30px) scale(0.95);
      }
    }

    .text {
      color: #c5c6c7;
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 20px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .action-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #45a29e 0%, #66fcf1 100%);
      border: none;
      color: #0b0c10;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(102, 252, 241, 0.3);
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .action-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 252, 241, 0.5);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn.disabled {
      background: linear-gradient(135deg, #2a2e3b 0%, #3a3e4b 100%);
      cursor: not-allowed;
      box-shadow: none;
    }

    .action-btn.disabled:hover {
      transform: none;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #66fcf1;
      opacity: 0.6;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }

      h2 {
        font-size: 20px;
      }

      .status-indicator {
        display: none;
      }

      #messages {
        padding: 20px 16px;
      }

      .msg {
        padding: 20px;
      }
    }

    /* Loading animation */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(11, 12, 16, 0.3);
      border-top-color: #0b0c10;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-title">
        <div class="logo">🔥</div>
        <h2>Арбитражный Бот</h2>
      </div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span style="font-size: 13px; font-weight: 500;">Онлайн</span>
      </div>
    </div>
  </header>

  <div id="messages"></div>

  <script>
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const messages = new Map();
    const messagesContainer = document.getElementById("messages");

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.action === "create") {
        const div = document.createElement("div");
        div.className = "msg";
        div.id = data.id;

        // Проверяем тип сообщения
        if (data.message_type === "update_spread") {
          // Для update_spread показываем только кнопку "Выход"
          div.innerHTML = `
            <div class="text">${data.text}</div>
            <button class="action-btn" onclick="exitMessage('${data.id}')">
              Выход
            </button>
          `;
        } else {
          // Для обычных сообщений показываем кнопку "Схождения"
          div.innerHTML = `
            <div class="text">${data.text}</div>
            <button class="action-btn"
                data-exchange-long='${JSON.stringify(data.exchange_long)}'
                data-exchange-short='${JSON.stringify(data.exchange_short)}'
                data-symbol='${data.symbol}'
                data-volume='${data.volume}'
                data-long-price='${data.long_price}'
                data-short-price='${data.short_price}'
                data-spread='${data.spread}'
                onclick="openPosition(this)">
                Схождения
            </button>
          `;
        }
        
        messagesContainer.prepend(div);
        messages.set(data.id, div);

        // Trigger animation
        setTimeout(() => div.style.opacity = '1', 10);

      } else if (data.action === "update" && messages.has(data.id)) {
        const div = messages.get(data.id);
        div.querySelector(".text").innerHTML = data.text;
        div.classList.add("updated");
        setTimeout(() => div.classList.remove("updated"), 600);

      } else if (data.action === "delete" && messages.has(data.id)) {
        const div = messages.get(data.id);
        div.classList.add("deleting");
        setTimeout(() => {
          div.remove();
          messages.delete(data.id);
        }, 400);
      }
    };

    async function openPosition(btn) {
      btn.disabled = true;
      btn.classList.add("disabled");
      const originalText = btn.innerText;
      btn.innerHTML = 'Парсинг<span class="loading"></span>';

      const exchangeLong = JSON.parse(btn.dataset.exchangeLong);
      const exchangeShort = JSON.parse(btn.dataset.exchangeShort);
      const symbol = btn.dataset.symbol;
      const volume = parseFloat(btn.dataset.volume);
      const long_price = parseFloat(btn.dataset.longPrice);
      const short_price = parseFloat(btn.dataset.shortPrice);
      const spread = parseFloat(btn.dataset.spread);

      try {
        const res = await fetch("/open_trade", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            exchange_long: exchangeLong, 
            exchange_short: exchangeShort, 
            symbol, 
            volume,
            long_price,
            short_price,
            spread, 
          })
        });

        if (res.ok) {
          btn.innerText = "Парсинг ✅";
          btn.style.background = "linear-gradient(135deg, #4ade80 0%, #22c55e 100%)";
        } else {
          btn.innerText = "Ошибка ❌";
          btn.style.background = "linear-gradient(135deg, #ef4444 0%, #dc2626 100%)";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.disabled = false;
            btn.classList.remove("disabled");
            btn.style.background = "";
          }, 3000);
        }
      } catch (e) {
        console.error(e);
        btn.innerText = "Ошибка ❌";
        btn.style.background = "linear-gradient(135deg, #ef4444 0%, #dc2626 100%)";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.disabled = false;
          btn.classList.remove("disabled");
          btn.style.background = "";
        }, 3000);
      }
    }

    // Новая функция для кнопки "Выход"
    async function exitMessage(messageId) {
      try {
        const res = await fetch("/exit_message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message_id: messageId })
        });

        if (res.ok) {
          // Удаляем сообщение из UI
          const div = messages.get(messageId);
          if (div) {
            div.classList.add("deleting");
            setTimeout(() => {
              div.remove();
              messages.delete(messageId);
            }, 400);
          }
        }
      } catch (e) {
        console.error("Error exiting message:", e);
      }
    }

    ws.onerror = (e) => console.error("WebSocket error:", e);
    ws.onclose = () => {
      console.log("WebSocket closed");
      document.querySelector(".status-dot").style.background = "#ef4444";
      document.querySelector(".status-indicator span").innerText = "Отключено";
    };
  </script>
</body>
</html>
